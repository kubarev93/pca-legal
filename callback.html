<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OAuth Callback — Prime Clip Agent</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #1a1a1a; background: #ffffff; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 24px; margin: 0 0 16px; }
  .box { background: #f4f6f8; border: 1px solid #dfe3e6; border-radius: 10px; padding: 16px; margin: 0 0 16px; word-break: break-all; }
  .label { color: #666; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .value { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #0b62d6; background: #0b62d6; color: #fff; cursor: pointer; }
  .muted { color: #666; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Authorization code received</h1>
  <div class="box">
    <div class="label">code</div>
    <div class="value" id="code">—</div>
  </div>
  <div class="box">
    <div class="label">state</div>
    <div class="value" id="state">—</div>
  </div>
  <button id="copy">Copy code</button>
  <p class="muted" id="hint">Copy the code above and paste it into the tiktok-auth command.</p>
  <script>
    var params = new URLSearchParams(window.location.search);
    var code = params.get("code") || "";
    var state = params.get("state") || "";
    var error = params.get("error") || params.get("error_description") || "";
    document.getElementById("code").textContent = code || (error ? "error: " + error : "no code in URL");
    document.getElementById("state").textContent = state || "—";
    document.getElementById("copy").addEventListener("click", function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById("hint").textContent = "Copied.";
      });
    });
  </script>
</main>
</body>
</html>
